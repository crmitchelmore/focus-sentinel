<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ring { fill: #EBE7DF; stroke: #1E2427; stroke-opacity: 0.14; stroke-width: 1; }
    .dot { fill: #B06A10; }
    @media (prefers-color-scheme: dark) {
      .ring { fill: #2A3033; stroke: #EDF1F0; }
      .dot { fill: #E39A2E; }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="15"/>
  <circle class="dot" cx="16" cy="16" r="10"/>
</svg>
