name: Build and verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: macOS gate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set and verify the standard accessibility baseline
        shell: zsh {0}
        run: |
          # Runner images enable both settings to disable graphic effects. The standard
          # panel lane requires them off; dedicated injected-trait tests cover them on.
          # https://github.com/actions/runner-images/blob/main/images/macos/scripts/build/configure-system.sh
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess reduceTransparency -bool false
          swift -e 'import AppKit; let workspace = NSWorkspace.shared; precondition(!workspace.accessibilityDisplayShouldReduceMotion, "Reduce Motion is still enabled"); precondition(!workspace.accessibilityDisplayShouldReduceTransparency, "Reduce Transparency is still enabled"); print("Standard accessibility baseline verified through AppKit")'
      - name: Verify build, tests, runtime and release artefact
        shell: zsh {0}
        env:
          FOCUS_LOG_DIR: ${{ runner.temp }}/focus-gate
        run: |
          mkdir -p "$FOCUS_LOG_DIR"
          touch "$FOCUS_LOG_DIR/focus-gate.log"
          tail -n +1 -F "$FOCUS_LOG_DIR/focus-gate.log" &
          gate_log_pid=$!
          trap 'kill "$gate_log_pid" 2>/dev/null || true' EXIT
          scripts/build-gate.sh
          gate_rc=$?
          exit "$gate_rc"
      - name: Preserve readable diagnostics in the job log
        if: always()
        shell: zsh {0}
        run: |
          for gate_log in "$RUNNER_TEMP/focus-gate"/*.log(N); do
            echo "::group::${gate_log:t}"
            tail -100 "$gate_log"
            echo '::endgroup::'
          done
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focus-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/focus-gate
          if-no-files-found: error
          retention-days: 14
