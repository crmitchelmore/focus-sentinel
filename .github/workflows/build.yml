name: Build and verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: macOS gate
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FOCUS_LOG_DIR: ${{ runner.temp }}/focus-gate
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify build, tests, runtime and release artefact
        shell: zsh {0}
        run: scripts/build-gate.sh
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focus-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/focus-gate
          if-no-files-found: error
          retention-days: 14
