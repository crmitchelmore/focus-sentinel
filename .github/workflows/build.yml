name: Build and verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: macOS gate
    # **The persistent Mac, not a hosted image** (focus-oqsx). The hosted macOS lane stopped
    # starting at all — "the job was not started because recent account payments have failed" —
    # so every gate on both open pull requests was red for a reason no commit could fix. This is
    # the same machine the gate is developed on, registered as a repository runner, and the
    # repository is private, so a pull request cannot bring code from a stranger onto it.
    runs-on: [bravo-mini-local, macOS, ARM64]
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the standard accessibility baseline
        shell: zsh {0}
        run: |
          # The standard panel lane requires Reduce Motion and Reduce Transparency off;
          # dedicated injected-trait tests cover them on. A hosted image enables both and the
          # step used to write them off — but this runs on somebody's own Mac now, and a gate
          # that reaches into a person's accessibility settings to make its pictures match is
          # doing the one thing this app exists to argue against. So it reads and says so.
          swift -e 'import AppKit; let workspace = NSWorkspace.shared; precondition(!workspace.accessibilityDisplayShouldReduceMotion, "Reduce Motion is on for this account. The snapshot lane photographs the standard baseline, so turn it off in System Settings > Accessibility > Display before running the gate."); precondition(!workspace.accessibilityDisplayShouldReduceTransparency, "Reduce Transparency is on for this account. Turn it off in System Settings > Accessibility > Display before running the gate."); print("Standard accessibility baseline verified through AppKit")'
      - name: Verify build, tests, runtime and release artefact
        shell: zsh {0}
        env:
          FOCUS_LOG_DIR: ${{ runner.temp }}/focus-gate
        run: |
          mkdir -p "$FOCUS_LOG_DIR"
          touch "$FOCUS_LOG_DIR/focus-gate.log"
          tail -n +1 -F "$FOCUS_LOG_DIR/focus-gate.log" &
          gate_log_pid=$!
          trap 'kill "$gate_log_pid" 2>/dev/null || true' EXIT
          scripts/build-gate.sh
          gate_rc=$?
          exit "$gate_rc"
      - name: Preserve readable diagnostics in the job log
        if: always()
        shell: zsh {0}
        run: |
          for gate_log in "$RUNNER_TEMP/focus-gate"/*.log(N); do
            echo "::group::${gate_log:t}"
            tail -100 "$gate_log"
            echo '::endgroup::'
          done
      - name: Retain gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focus-gate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/focus-gate
          if-no-files-found: error
          retention-days: 14
