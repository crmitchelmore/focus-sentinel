name: Build and verify

on:
  workflow_dispatch:
    inputs:
      confirm_ui_tests:
        description: I approve this full UI and runtime test batch
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: focus-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: macOS gate
    runs-on: [bravo-mini-local, macOS, ARM64]
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Require approval for UI tests
        env:
          CONFIRMED: ${{ inputs.confirm_ui_tests }}
        run: test "$CONFIRMED" = true
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify build, tests, runtime and release artefact
        shell: zsh {0}
        env:
          FOCUS_LOG_DIR: ${{ runner.temp }}/focus-gate
        run: |
          mkdir -p "$FOCUS_LOG_DIR"
          touch "$FOCUS_LOG_DIR/focus-gate.log"
          tail -n +1 -F "$FOCUS_LOG_DIR/focus-gate.log" &
          gate_log_pid=$!
          trap 'kill "$gate_log_pid" 2>/dev/null || true' EXIT
          scripts/build-gate.sh
          gate_rc=$?
          exit "$gate_rc"
      - name: Preserve readable diagnostics in the job log
        if: always()
        shell: zsh {0}
        run: |
          for gate_log in "$RUNNER_TEMP/focus-gate"/*.log(N); do
            echo "::group::${gate_log:t}"
            tail -100 "$gate_log"
            echo '::endgroup::'
          done
