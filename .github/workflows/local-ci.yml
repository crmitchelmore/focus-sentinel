name: Local CI
run-name: Local CI / ${{ inputs.mode }} / ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify the runner, inspect signing availability, build without UI tests, run the package unit suites, or run the FocusUI snapshot lane'
        type: choice
        options: [verify, signing, build, unit, snapshots]
        default: build
      ref:
        description: 'Trusted branch, tag or commit in this repository'
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: local-ci-${{ github.repository }}
  cancel-in-progress: false
jobs:
  local:
    name: Local CI
    if: inputs.mode != 'signing' || github.actor == github.repository_owner
    runs-on: [bravo-mini-local, macOS, ARM64]
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Verify the persistent runner
        shell: bash
        run: |
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          echo "Runner: $RUNNER_NAME"
          xcodebuild -version
          git --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.mode != 'verify'
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect signing availability without exporting credentials
        if: inputs.mode == 'signing'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          signing = json.load(open("Config/ReleasePipeline.json"))["signing"]

          def inspect(arguments):
              return subprocess.run(arguments, capture_output=True, text=True, timeout=90)

          identities = inspect(["security", "find-identity", "-p", "codesigning"])
          valid = inspect(["security", "find-identity", "-v", "-p", "codesigning"])
          certificates = inspect([
              "security", "find-certificate", "-a", "-c", signing["identity"], "-p"
          ])
          sparkle = inspect([
              "security", "find-generic-password", "-a", signing["sparkleKeychainAccount"]
          ])
          notary = inspect([
              "xcrun", "notarytool", "history", "--keychain-profile",
              signing["notarytoolKeychainProfile"], "--output-format", "json"
          ])
          identity_available = signing["identity"] in valid.stdout
          print(json.dumps({
              "developerIDCertificateCount": certificates.stdout.count("-----BEGIN CERTIFICATE-----"),
              "developerIDIdentityPresent": signing["identity"] in identities.stdout,
              "developerIDIdentityValid": identity_available,
              "sparkleKeychainAccountPresent": sparkle.returncode == 0,
              "notaryProfileAuthenticated": notary.returncode == 0,
          }, indent=2))
          if identities.returncode or valid.returncode or not identity_available:
              print("::error::No usable Developer ID Application identity is available to this runner.")
          if notary.returncode:
              print("::error::The configured notarization profile could not authenticate.")
          sys.exit(0 if identity_available and notary.returncode == 0 else 1)
          PY
      - name: Build and non-UI checks
        if: inputs.mode == 'build'
        shell: bash
        run: |
          xcodebuild -workspace Focus.xcworkspace -scheme FocusSentinel -configuration Debug -destination "platform=macOS,arch=arm64" -derivedDataPath "$RUNNER_TEMP/focus-derived-data" -jobs 2 build
      - name: Source lints and package unit suites
        if: inputs.mode == 'unit'
        shell: bash
        # On this runner, never on the owner's own Mac: FocusHost's suite presents real popovers and
        # nudge panels. FocusUI snapshot suites skip under `swift test`; the xcodebuild UI lane is
        # not run here.
        run: |
          set -o pipefail
          cache="$RUNNER_TEMP/swiftpm-cache-focus"
          zsh scripts/check-boundaries.sh
          zsh scripts/check-forbidden.sh
          for package in FocusClassify FocusHost; do
            echo "::group::swift test $package"
            swift test --package-path "Packages/$package" --cache-path "$cache"
            echo "::endgroup::"
          done
      - name: FocusUI snapshot lane
        if: inputs.mode == 'snapshots'
        shell: bash
        # The UI lane, on this runner only (the owner's ruling: never on his own Mac). A failing
        # comparison leaves its candidate in the result bundle; the next step exports them so a
        # changed baseline can be recorded from the artifact rather than from a local run.
        run: |
          set -o pipefail
          xcodebuild -workspace Focus.xcworkspace -scheme FocusUnitTests -destination "platform=macOS,arch=arm64" -derivedDataPath "$RUNNER_TEMP/focus-derived-data" -resultBundlePath "$RUNNER_TEMP/ui.xcresult" -only-testing:FocusUITests test
      - name: Export snapshot candidates
        if: always() && inputs.mode == 'snapshots'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ui-attachments"
          if [ -d "$RUNNER_TEMP/ui.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/ui-attachments" || true
          fi
          ls "$RUNNER_TEMP/ui-attachments" | wc -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.mode == 'snapshots'
        with:
          name: snapshot-candidates
          path: ${{ runner.temp }}/ui-attachments
          if-no-files-found: warn
          retention-days: 7
