name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [bravo-mini-local, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      # Resolve main when this serialised job starts, so queued runs cannot roll back the site.
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Require deployment credentials and site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Configure CLOUDFLARE_API_TOKEN; see site-deployment.md'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Configure CLOUDFLARE_ACCOUNT_ID; see site-deployment.md'; exit 1; }
          test -s site/index.html
          test -s site/companion.png

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.129.1 pages deploy site --project-name=focus-sentinel --branch=main

      - name: Verify production HTML and image
        run: |
          for attempt in $(seq 1 12); do
            echo "Production verification attempt $attempt"
            if curl -fsS --connect-timeout 10 --max-time 20 "https://focus-sentinel.win/?deployment=$GITHUB_SHA" -o /tmp/live.html &&
               curl -fsS --connect-timeout 10 --max-time 20 "https://focus-sentinel.win/companion.png?deployment=$GITHUB_SHA" -o /tmp/live.png &&
               cmp -s site/index.html /tmp/live.html && cmp -s site/companion.png /tmp/live.png; then
              echo 'Production HTML and image match the deployment source.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Production did not match the deployed source.'
          exit 1
